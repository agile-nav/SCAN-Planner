# ============================================================================
# 文件：tools/sim_check_path.yaml —— 三机型仿真自检用的短参考路径
#
# 为什么单独一条：
#   仓库自带的 reference_path.map.yaml 是一条 10 m 的“楼梯”路径（z 从 0.1 升到 1.55），
#   用于演示参考路径模式；但仿真里的 go2_kinematic_sim 是平面运动学（z 固定），
#   长距离 + z 坡道会让局部目标/碰撞层的行为变得不适合做“机器人栈”烟测。
#
#   自检只需要验证：模型/参数/规划/控制/里程计这条链路能跑通。
#   所以这里给一条 3 m 的平地短路，起点与三机型 mode3 的默认初始位置一致
#   （-5.5, 5.5），终点 (-5.5, 3.5)，z 保持地面高度 0。
#
# 发布延迟 3 s：给探针留出 DDS 订阅建立时间，避免机器人先跑完、
# 探针才连上 planning/bspline 与状态话题（GPU 后端启动更慢）。
#
# 用法：tools/sim_check.sh 内部使用，不需要手动启动。
# ============================================================================
reference_path_publisher:
  ros__parameters:
    frame_id: world
    publish_delay_sec: 3.0
    waypoints:
      [-5.5, 5.5, 0.0,
       -5.5, 3.5, 0.0]
