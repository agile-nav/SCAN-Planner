robot:
  name: go2
  description_package: go2_description
  model_file: xacro/robot.xacro
  model_args: ["use_gazebo:=false"]
  root_link: base

# ============================================================================
# 文件：config/robots/go2.yaml —— Go2 机型档案
#
# 【数据来源】
#   宇树官方 Go2 参数页（机械规格 / 性能参数）：
#   https://www.unitree.com/go2
#   规格摘要：站立尺寸 70 × 31 × 40 cm，整机约 15 kg；
#   速度 0~2.5 m/s（AIR）/ 0~3.5 m/s（PRO）/ 0~3.7 m/s（X、EDU，最高约 5 m/s）。
#
# 【怎么用】
#   ros2 launch scan_planner run.launch.py robot:=go2
#
# 【只写“与机型相关”的项】
#   下面只覆盖机器人外形与规划速度上限；局部地图尺寸、初始位置、话题名等
#   与场地/驱动栈相关，按实际情况在下面补写或直接用命令行参数。
# ============================================================================
scan_planner_node:
  ros__parameters:
    # 目标来源由 launch 参数 navi_mode:=1|2|3 决定，不写进机型档案
    # 规划视野(米)：必须 <= 滑动地图半宽 - 圆柱半径。
    # 通用默认 7.5 m 大于 10 m 地图的半宽 5 m，前视点会落到图外被当成障碍；
    # 这里按 4.5 m 配置（运行时 getLocalTarget 还会按 local_update_range 再夹一次）。
    fsm.planning_horizon: 4.5
    manager.planning_horizon: 4.5

    # ---- 机器人外形（由官方站立尺寸换算）----
    # 规划器把机器人看成“前后两个圆柱”，要求两圆并集 == 站立投影矩形：
    #   前后偏移 = L/4 = 0.70/4 = 0.175
    #   半径     = hypot(L/4, W/2) = hypot(0.175, 0.155) ≈ 0.234
    # 每个圆正好穿过自己那半个矩形的两个角点，并集完整覆盖
    # 0.70 × 0.31 m 站立投影，机身中部无空隙（判据：offset ≤ radius）。
    grid_map.double_cylinder_radius: 0.234
    grid_map.double_cylinder_offset: 0.175
    # 站立高度 0.40 m（官方机械规格）。该值会加到参考路径的 z 上
    # （外部给的是地面高度）；若你的路径 z 已包含机身高度，改成 0.0。
    # 注意：严格说这里应填「机身中心离地高度」（按 xacro 腿长/站立关节角约 0.33 m），
    # 0.40 是整机高度；拿到实机实测值后建议替换。
    grid_map.body_height: 0.40
    # RealSense 深度内参（真机标定值；如非 RealSense 请按实际相机修改）
    grid_map.cx: 317.19183349609375
    grid_map.cy: 256.4806823730469
    grid_map.fx: 609.5884399414062
    grid_map.fy: 609.22021484375

    # 自身点云过滤半径(米)：真机激光会打到自己的腿/机身，必须滤掉。
    # 0=关闭；这是初始值，请按实机点云核对（A2 实测为 0.45）。
    grid_map.self_filter_radius: 0.40
    # 竖直膨胀（参数名与论文 d_up/d_down 相反）：保护区间 [h_c-z_up, h_c+z_down]。
    # 初始沿用通用默认，需按实测传感器离地高度 + 台阶指标核对。
    grid_map.obstacles_inflation_z_up: 0.1
    grid_map.obstacles_inflation_z_down: 0.4

    # ---- 速度上限 ----
    # 官方最高 2.5~3.7 m/s（视型号），但那是硬件极限；规划速度上限按
    # 保守值取 1.0 m/s，按场地与步态再调。
    manager.max_vel: 1.0
    optimization.max_vel: 1.0

closed_loop_controller:
  ros__parameters:
    max_vx: 1.0

quadruped_kinematic_sim:
  ros__parameters:
    max_vx: 1.0

# 以下不是节点参数，由 run.launch.py 读取使用
robot_topics:
  # 真机话题名：按 Go2 上实际运行的 LIO 输出核对/修改
  # （不写则用启动文件里的默认值 /lio/robo/odom 等）
  body_pose: /lio/robo/odom
  sensor_pose: /lio/imu/odom
  cloud: /lio/cloud_world
  # 深度相机（sensor_type:=depth 时使用）
  depth: /camera/aligned_depth_to_color/image_raw
  # 速度指令话题：若使用 go2_ros2_sdk / unitree_ros2 的 cmd_vel 桥，按实际话题改
  cmd_vel: /cmd_vel
  # 外部使能：遥控器 START/B 发布 true/false；驱动栈不同可按实际话题改
  motion_enabled: /motion_enabled
  # 点云是否已经在世界系下
  cloud_is_world: true
  # sensor_pose 若已是激光/相机本体位姿，改成 false；是 IMU 位姿则保持 true
  need_extrinsic: true
  # 初始位置 [x, y, z]；不写则按 navi_mode 取默认值
  # init: [-19.0, 1.0, 0.25]

# 仿真传感器安装位姿（可选；不写则用 common.yaml 的默认值）
# pcl_render_node:
#   ros__parameters:
#     sensor_mount_xyz: [0.0, 0.0, 0.0]
#     sensor_mount_rpy: [-1.570796, 0.0, -1.570796]

# Gazebo 物理仿真资产（robot_gazebo.launch.py 读取；主仿真 run.launch.py 不使用）
gazebo:
  world: worlds/empty.sdf
  bridge_config: config/bridge.yaml
  controllers: [joint_state_broadcaster, joint_trajectory_controller]
  spawn_name: go2
  xacro_args: ["use_gazebo:=true"]
