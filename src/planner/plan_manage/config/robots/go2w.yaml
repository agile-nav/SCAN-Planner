robot:
  name: go2w
  description_package: go2w_description
  model_file: xacro/robot.xacro
  model_args: ["use_gazebo:=false"]
  root_link: base

# ============================================================================
# 文件：config/robots/go2w.yaml —— Go2-W（轮足）机型档案
#
# 【数据来源】
#   宇树官方 Go2-W 参数页（机械规格 / 性能参数）：
#   https://www.unitree.com/go2-w
#   规格摘要：站立尺寸 70 × 43 × 50 cm，整机约 18 kg，速度 0~2.5 m/s，
#   最大爬坡角 35°，7 英寸充气轮胎。
#
# 【怎么用】
#   ros2 launch scan_planner run.launch.py robot:=go2w
#
# 【与 Go2 的差异】
#   Go2-W 多了轮子，车体更宽（43 cm）、更高（50 cm），但纵向长度相同（70 cm），
#   所以“前后两圆柱”的半径更大、偏移更小；速度上限较低（2.5 m/s）。
# ============================================================================
scan_planner_node:
  ros__parameters:
    # 目标怎么来：与 A2 一致用参考路径模式；没有外部全局路径时改成 1
    fsm.navi_mode: 3
    # 规划视野(米)：必须 <= 滑动地图半宽 - 圆柱半径。
    # 通用默认 7.5 m 大于 10 m 地图的半宽 5 m，前视点会落到图外被当成障碍；
    # 这里按 4.5 m 配置（运行时 getLocalTarget 还会按 local_update_range 再夹一次）。
    fsm.planning_horizon: 4.5

    # ---- 机器人外形（由官方站立尺寸换算）----
    # 同 go2.yaml 的公式：
    #   前后偏移 = L/4 = 0.70/4 = 0.175
    #   半径     = hypot(L/4, W/2) = hypot(0.175, 0.215) ≈ 0.277
    grid_map.double_cylinder_radius: 0.277
    grid_map.double_cylinder_offset: 0.175
    # 站立高度 0.50 m（官方机械规格）。该值会加到参考路径的 z 上
    # （外部给的是地面高度）；若你的路径 z 已包含机身高度，改成 0.0。
    # 注意：严格说这里应填「机身中心离地高度」，0.50 是整机高度（含轮）；
    # 拿到实机实测值后建议替换。
    grid_map.body_height: 0.50
    # RealSense 深度内参（真机标定值；如非 RealSense 请按实际相机修改）
    grid_map.cx: 317.19183349609375
    grid_map.cy: 256.4806823730469
    grid_map.fx: 609.5884399414062
    grid_map.fy: 609.22021484375

    # 自身点云过滤半径(米)：轮足更容易打到自己的轮子/机身，真机必须滤掉。
    # 0=关闭；这是初始值，请按实机点云核对。
    grid_map.self_filter_radius: 0.45
    # 竖直膨胀（参数名与论文 d_up/d_down 相反）：保护区间 [h_c-z_up, h_c+z_down]。
    # 初始沿用通用默认，需按实测传感器离地高度 + 台阶指标核对。
    grid_map.obstacles_inflation_z_up: 0.1
    grid_map.obstacles_inflation_z_down: 0.4

    # ---- 速度上限 ----
    # 官方最高 2.5 m/s；规划速度上限按保守值取 1.0 m/s，按场地再调。
    manager.max_vel: 1.0
    optimization.max_vel: 1.0

closed_loop_controller:
  ros__parameters:
    max_vx: 1.0

go2_kinematic_sim:
  ros__parameters:
    max_vx: 1.0

# 以下不是节点参数，由 run.launch.py 读取使用
robot_topics:
  # 真机话题名：按 Go2-W 上实际运行的 LIO 输出核对/修改
  body_pose: /lio/robo/odom
  sensor_pose: /lio/imu/odom
  cloud: /lio/cloud_world
  # 深度相机（sensor_type:=depth 时使用）
  depth: /camera/aligned_depth_to_color/image_raw
  # 速度指令话题：若使用 Unitree 的 cmd_vel 桥，按实际话题改
  cmd_vel: /cmd_vel
  # 外部使能：遥控器 START/B 发布 true/false；驱动栈不同可按实际话题改
  motion_enabled: /motion_enabled
  cloud_is_world: true
  # sensor_pose 若已是激光/相机本体位姿，改成 false；是 IMU 位姿则保持 true
  need_extrinsic: true
  # init: [-19.0, 1.0, 0.25]

# 仿真传感器安装位姿（可选；不写则用 common.yaml 的默认值）
# pcl_render_node:
#   ros__parameters:
#     sensor_mount_xyz: [0.0, 0.0, 0.0]
#     sensor_mount_rpy: [-1.570796, 0.0, -1.570796]
